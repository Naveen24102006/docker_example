apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: html-demo
  template:
    metadata:
      labels:
        app: html-demo
    spec:
      containers:
        - name: html-demo
          image: naveen24102006/html-demo1:latest
          ports:
            - containerPort: 80
